# PonyArchive — nginx del frontend
#  * SPA: cualquier ruta desconocida cae en index.html (React Router)
#  * /api y /health se reenvían al servicio `backend` de docker-compose
#    (así no hace falta CORS cuando todo va detrás del mismo origen)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # la subida máxima son 20 MB (ver backend: max_upload_mb)
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # la primera generación tarda ~45 s
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets con hash: caché agresiva
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
