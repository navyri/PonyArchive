# Blueprint de Render: backend de PonyArchive (plan free, 0 USD).
# Los valores secretos (OPENAI_API_KEY, QDRANT_URL, QDRANT_API_KEY) se
# cargan desde el panel de Render; no van en el repo.
services:
  - type: web
    name: ponyarchive-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBEDDINGS_PROVIDER
        value: openai
      - key: LLM_PROVIDER
        value: openai
      - key: VECTOR_PROVIDER
        value: qdrant
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: QDRANT_COLLECTION
        value: ponyarchive
      - key: AUTH_PROVIDER
        value: local
      - key: HIDE_API_DOCS
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
    freePlan: true
