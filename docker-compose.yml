# PonyArchive — orquestación local en contenedores
#
#   docker compose up --build
#     frontend  -> http://localhost:8081   (nginx + proxy /api -> backend)
#     backend   -> http://localhost:8010   (FastAPI, para pruebas directas)
#
# Requisitos previos en el host:
#   * Docker Desktop en marcha
#   * Ollama corriendo con el modelo:  ollama run qwen3.5:4b
#     El contenedor habla con él vía host.docker.internal:11434
#
# Los puertos 5173/8080/8180/5432 ya están ocupados por otros proyectos en esta
# máquina, por eso el frontend usa el 8081 y el backend el 8010.

services:
  backend:
    build: ./backend
    container_name: ponyarchive-backend
    ports:
      - "8010:8000"
    environment:
      # Clave de firma JWT: cámbiala en producción (ver .env.example)
      SECRET_KEY: ${SECRET_KEY:-ponyarchive-clave-de-desarrollo-cambiar-en-produccion}
      APP_ENV: ${APP_ENV:-prod}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      # Ollama vive en el host (modelo local)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      # El navegador entra por el 8081; aunque nginx hace de proxy, el CORS extra no estorba
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173,http://localhost:5174}
    volumes:
      # persistencia entre arranques (usuarios, conversaciones y vectores)
      - backend-data:/app/data
      - backend-vector:/app/vectorstore
    extra_hosts:
      # necesario en Linux; en Windows/Docker Desktop ya existe
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ponyarchive-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-vector:
